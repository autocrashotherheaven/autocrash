<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://player.vimeo.com https://f.vimeocdn.com 'unsafe-inline'; style-src 'self' https://f.vimeocdn.com 'unsafe-inline'; frame-src 'self' https://player.vimeo.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronized Video Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100vw !important;
            height: 100vh !important;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div id="video-embed">
            <iframe
                id="vimeo-player"
                src="https://player.vimeo.com/video/1213494837?autoplay=1&muted=1&controls=0"
                allow="autoplay; fullscreen; accelerometer; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                webkitallowfullscreen
                mozallowfullscreen
            ></iframe>
        </div>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        // CONFIGURATION
        const VIDEO_DURATION = 3783; // Duration in seconds

        // Calculate the current playback position based on GMT
        function getVideoStartTime() {
            const now = new Date();
            const gmtMidnight = new Date(now.toLocaleString('en-US', { timeZone: 'GMT' }));
            gmtMidnight.setHours(0, 0, 0, 0);
            const secondsSinceMidnight = Math.floor((now - gmtMidnight) / 1000);
            return secondsSinceMidnight % VIDEO_DURATION;
        }

        // Initialize player
        function initializePlayer() {
            const iframe = document.getElementById('vimeo-player');
            const player = new Vimeo.Player(iframe);
            const startTime = getVideoStartTime();

            // Quick seek on play start
            player.on('play', () => {
                player.getCurrentTime().then(currentTime => {
                    if (currentTime < 1) {
                        player.setCurrentTime(startTime);
                    }
                });
            });

            // Loop at end
            player.on('ended', () => {
                player.setCurrentTime(0).then(() => {
                    player.play();
                });
            });
        }

        window.addEventListener('load', initializePlayer);
    </script>
</body>
</html>
