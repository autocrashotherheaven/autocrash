<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://player.vimeo.com https://f.vimeocdn.com 'unsafe-inline'; style-src 'self' https://f.vimeocdn.com 'unsafe-inline'; frame-src 'self' https://player.vimeo.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronized Video Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100vw !important;
            height: 100vh !important;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div id="video-embed">
            <iframe
                id="vimeo-player"
                src="https://player.vimeo.com/video/1213494837?autoplay=0&muted=1"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
            ></iframe>
        </div>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        // CONFIGURATION
        const VIDEO_DURATION = 3783; // Duration in seconds (1h03m03s) - set this to your video's duration

        // Calculate the current playback position based on GMT
        function getVideoStartTime() {
            const now = new Date();
            
            // Get seconds since midnight GMT
            const gmtMidnight = new Date(now.toLocaleString('en-US', { timeZone: 'GMT' }));
            gmtMidnight.setHours(0, 0, 0, 0);
            
            const secondsSinceMidnight = Math.floor((now - gmtMidnight) / 1000);
            
            // Calculate position in the video loop
            const videoPosition = secondsSinceMidnight % VIDEO_DURATION;
            
            return videoPosition;
        }

        // Initialize Vimeo player with API
        function initializePlayer() {
            const iframe = document.getElementById('vimeo-player');
            const player = new Vimeo.Player(iframe);

            player.ready().then(() => {
                console.log('Player ready');
                const startTime = getVideoStartTime();
                console.log('Setting start time to:', startTime);
                
                player.setCurrentTime(startTime).then(() => {
                    player.setMuted(true);
                    player.play().catch(err => {
                        console.error('Play error:', err);
                    });
                }).catch(err => {
                    console.error('Error setting playback time:', err);
                });
            }).catch(err => {
                console.error('Player ready error:', err);
            });

            // Set up looping
            player.on('ended', () => {
                player.setCurrentTime(0).then(() => {
                    player.play();
                });
            });
        }

        // Initialize after Vimeo API is loaded
        if (window.Vimeo) {
            initializePlayer();
        } else {
            window.addEventListener('load', () => {
                setTimeout(initializePlayer, 500);
            });
        }
    </script>
</body>
</html>
